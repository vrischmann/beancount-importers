[project]
name = "beancount-importers"
version = "0.1.0"
description = "Beancount importers for Crédit Mutuel and Fortuneo"
authors = [
    {name = "Vincent Rischmann", email = "vincent@rischmann.fr"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beancount>=3",
    "beangulp>=0.2.0,<0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["beancount_ccm", "beancount_fortuneo", "beancount_helpers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
